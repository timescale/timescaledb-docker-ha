name: Publish images

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"

  schedule:
    - cron: '0 7 * * 2'

concurrency:
  group: publish-ha-images-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REPOSITORY: timescale/timescaledb-ha
  DOCKER_REGISTRY: docker.io

jobs:
  publish:
    name: Publish pg${{ matrix.pg_major }}${{ matrix.all }}${{ matrix.oss }} ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ "amd64", "arm64" ]
        pg_major: [ "18", "17", "16", "15" ]
        all_versions: [ "false", "true" ]
        oss_only: [ "false", "true" ]

        include:
          - oss_only: "true"
            oss: "-oss"
          - all_versions: "true"
            all: "-all"
          # On-demand capacity: these runs need up to 2 hours. The weekly
          # publish also builds cold on purpose, so an interruption
          # rebuilds every layer.
          - platform: amd64
            runs_on: runs-on/fleet=linux-8cpu-x64-ondemand/env=ue1
          - platform: arm64
            runs_on: runs-on/fleet=linux-8cpu-ondemand/env=ue1

    runs-on: "${{ matrix.runs_on }}"

    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.ORG_DOCKER_HUB_USERNAME }}
          password: ${{ secrets.ORG_DOCKER_HUB_ACCESS_TOKEN }}

      - name: Setup | Docker Context
        run: if ! docker context use ha-builder; then docker context create ha-builder; fi

      - name: Setup | Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          endpoint: ha-builder
          buildkitd-config-inline: |
            [worker.oci]
              maxParallelism = 2

      # The packages in the image are not pinned. A cached build keeps the packages
      # of the build that wrote the cache. The weekly scheduled publish builds cold
      # and refreshes them; a publish from master ships what the PR build tested.
      # The extension tarballs build from pinned inputs, so a cold build reuses them.
      - name: Build and publish (pg${{ matrix.pg_major }}${{ matrix.all }}${{ matrix.oss }} ${{ matrix.platform }})
        id: build
        env:
          PLATFORM: ${{ matrix.platform }}
          PG_MAJOR: ${{ matrix.pg_major }}
          ALL_VERSIONS: ${{ matrix.all_versions }}
          OSS_ONLY: ${{ matrix.oss_only }}
          DOCKER_CACHE_SCOPE: pg${{ matrix.pg_major }}${{ matrix.all }}${{ matrix.oss }}-${{ matrix.platform }}
          DOCKER_CACHE_BRANCH: ${{ github.head_ref || github.ref_name }}
          DOCKER_CACHE_FROM: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
          EXTENSION_ARTIFACTS: "true"
        run: |
          GIT_REV="${GITHUB_REF#refs/tags/}" make publish-builder
          GIT_REV="${GITHUB_REF#refs/tags/}" make publish-release

      # Checks the image this job pushed, by digest. The check job that ran after
      # the manifests pulled every image again on a fresh runner.
      - name: Check pg${{ matrix.pg_major }}${{ matrix.all }}${{ matrix.oss }} ${{ matrix.platform }}
        env:
          PG_MAJOR: ${{ matrix.pg_major }}
          PLATFORM: ${{ matrix.platform }}
          CHECK_ARCHES: ${{ matrix.platform }}
          # The multi-arch tag does not exist yet, only the arch-suffixed one.
          # Spell the postfix out; ALL_VERSIONS and OSS_ONLY would append to it.
          ALL_VERSIONS: "false"
          OSS_ONLY: "false"
          DOCKER_TAG_POSTFIX: "${{ matrix.all }}${{ matrix.oss }}-${{ matrix.platform }}"
        run: make check

      - name: export outputs
        run: |
          mkdir -p /tmp/outputs
          builder_id="${{ steps.build.outputs.builder_id }}"
          release_id="${{ steps.build.outputs.release_id }}"
          touch "/tmp/outputs/builder-$(echo "$builder_id" | cut -d: -f2)"
          touch "/tmp/outputs/release-$(echo "$release_id" | cut -d: -f2)"

      - name: upload outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outputs-${{ matrix.pg_major }}-${{ matrix.all_versions }}-${{ matrix.oss_only }}-${{ matrix.platform }}
          path: /tmp/outputs/*
          if-no-files-found: error
          retention-days: 1

  publish-combined-manifests:
    name: Publish manifest pg${{ matrix.pg_major }}${{ matrix.docker_tag_postfix }}
    needs: [ "publish" ]
    runs-on: runs-on/fleet=linux-2cpu/env=ue1
    strategy:
      fail-fast: false

      matrix:
        pg_major: [ "18", "17", "16", "15" ]
        docker_tag_postfix: ["", "-all", "-oss", "-all-oss" ]
        include:
          - docker_tag_postfix: ""
            oss_only: "false"
            all_versions: "false"
          - docker_tag_postfix: "-all"
            oss_only: "false"
            all_versions: "true"
          - docker_tag_postfix: "-oss"
            oss_only: "true"
            all_versions: "false"
          - docker_tag_postfix: "-all-oss"
            oss_only: "true"
            all_versions: "true"

    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - name: Download arm64 outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: outputs-${{ matrix.pg_major }}-${{ matrix.all_versions }}-${{ matrix.oss_only }}-arm64
          path: /tmp/outputs
          pattern: '*'
          merge-multiple: true

      - name: Download amd64 outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: outputs-${{ matrix.pg_major }}-${{ matrix.all_versions }}-${{ matrix.oss_only }}-amd64
          path: /tmp/outputs
          pattern: '*'
          merge-multiple: true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.ORG_DOCKER_HUB_USERNAME }}
          password: ${{ secrets.ORG_DOCKER_HUB_ACCESS_TOKEN }}

      - name: Publish combined manifest for pg${{ matrix.pg_major }}${{ matrix.docker_tag_postfix }}
        env:
          PG_MAJOR: ${{ matrix.pg_major }}
          VERSION_TAG: pg${{ matrix.pg_major}}${{ matrix.docker_tag_postfix }}-builder
          DOCKER_TAG_POSTFIX: ${{ matrix.docker_tag_postfix }}
        run: make publish-manifests

  dispatch-ha-image-published-event:
    name: Dispatch HA image published event
    needs: [ "publish-combined-manifests" ]
    if: ${{ github.event_name == 'push' }}
    runs-on: runs-on/fleet=linux-2cpu/env=ue1

    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - name: Dispatch event to Publish cloud images workflow
        run: |
            curl -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: token ${{ secrets.ORG_AUTOMATION_TOKEN }}" \
            --request POST \
            --data '{"event_type": "ha_image_published"}' \
            https://api.github.com/repos/timescale/timescaledb-docker-cloud/dispatches
