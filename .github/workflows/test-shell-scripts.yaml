name: Shell Script Tests
on:
  push

jobs:
  tests:
    name: Test System Services
    runs-on: runs-on/fleet=linux-2cpu/env=ue1
    timeout-minutes: 2
    steps:
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Shellcheck and shfmt
        run: ./cicd/lint-sh "SC2148,SC2034,SC1091,SC2153,SC1090,SC2097,SC2098,SC2043" # exclude checks
