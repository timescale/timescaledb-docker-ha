name: Shell Script Tests
on:
  push

jobs:
  tests:
    name: Test System Services
    runs-on: runs-on/fleet=linux-2cpu/env=ue1
    timeout-minutes: 2
    steps:
      - uses: runs-on/action@46910bf61b41721b0579f237e186afb35477007a # v2.3.0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Shellcheck and shfmt
        run: ./cicd/lint-sh "SC2148,SC2034,SC1091,SC2153,SC1090,SC2097,SC2098,SC2043" # exclude checks
