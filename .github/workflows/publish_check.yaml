name: Publish check

on:
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"

concurrency:
  group: publish-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_REPOSITORY: timescale/timescaledb-ha
  DOCKER_REGISTRY: docker.io

jobs:
  # Dry-run the most demanding build variant (pg18-all = 4 PG versions) to catch
  # disk space and build issues before they hit the publish workflow.
  publish-check:
    name: Dry run pg18-all ${{ matrix.platform }}
    # No RunsOn runner picks up a job from a fork pull request, so without this
    # the job waits for a runner that never comes.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # On-demand capacity: this job needs 1h40m on average. A required check
    # must not run that long on spot capacity.
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runs_on: runs-on/fleet=linux-8cpu-x64-ondemand/env=ue1
          - platform: arm64
            runs_on: runs-on/fleet=linux-8cpu-ondemand/env=ue1

    steps:
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # BuildKit pulls the base image straight from Docker Hub. A login with the
      # pull-only token gives a higher pull limit than anonymous pulls.
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: timescale
          password: ${{ secrets.DOCKER_HUB_PULL_TOKEN }}

      - name: Setup | Docker Context
        run: if ! docker context use ha-builder; then docker context create ha-builder; fi

      - name: Setup | Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          endpoint: ha-builder
          buildkitd-config-inline: |
            [worker.oci]
              maxParallelism = 2

      # docker buildx reads the GitHub Actions cache API from these variables.
      # The runner only gives them to actions, so this step exports them.
      - name: Setup | Actions cache variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_SERVICE_V2']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }

      # `make release` also builds and smoke-tests the builder stage.
      - name: Build
        id: build
        env:
          PLATFORM: ${{ matrix.platform }}
          PG_MAJOR: "18"
          ALL_VERSIONS: "true"
          OSS_ONLY: "false"
          DOCKER_TAG_POSTFIX: "-cicheck"
          DOCKER_CACHE_SCOPE: pg18-all-${{ matrix.platform }}
          EXTENSION_ARTIFACTS_BUCKET: ${{ vars.EXTENSION_ARTIFACTS_BUCKET }}
          EXTENSION_ARTIFACTS: "true"
        run: make release

      # The `check` target pulls its image from the registry first, so it cannot
      # check a local image. check-sha runs the same install checks on the local
      # release image that the build step tagged.
      - name: Check pg18-all ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
          CHECK_IMAGE: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}:pg18-cicheck-all-${{ matrix.platform }}
        run: make get-image-config check-sha CICD_ARCH_URL="$CHECK_IMAGE"
