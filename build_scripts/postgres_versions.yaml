## The pg versions that will be installed.
## from https://www.postgresql.org/about/news/postgresql-186-1711-1615-1519-1424-and-19-beta-3-released-3365/
## 18.5 is absent because upstream never shipped it, so 18.4 goes straight to 18.6.
## 15 stays on the May set: PG15 is being deprecated and timescaledb dropped it in 2.29.0.
## Separate from versions.yaml: a change here rebuilds everything after the PostgreSQL install.
postgres_versions:
  18: 18.6
  17: 17.11
  16: 16.15
  15: 15.18
